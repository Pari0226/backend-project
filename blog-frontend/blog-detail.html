<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Details | My Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #222;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 18px 0;
        }

        .header-container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #111;
        }

        .logo span {
            color: #6366f1;
        }

        .nav {
            display: flex;
            gap: 30px;
        }

        .nav a {
            color: #555;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav a:hover {
            color: #6366f1;
        }

        /* =========================
           BLOG CONTAINER
        ========================= */

        .blog-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* =========================
           BLOG HEADER
        ========================= */

        .blog-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .category {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .blog-title {
            font-size: 48px;
            line-height: 1.2;
            max-width: 850px;
            margin: auto;
            color: #111827;
        }

        .blog-description {
            max-width: 700px;
            margin: 20px auto;
            color: #6b7280;
            font-size: 18px;
        }

        /* =========================
           AUTHOR
        ========================= */

        .author-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .author-image {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .author-details {
            text-align: left;
        }

        .author-name {
            font-weight: 600;
            color: #111;
        }

        .blog-date {
            font-size: 13px;
            color: #777;
        }

        /* =========================
           FEATURED IMAGE
        ========================= */

        .featured-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 18px;
            display: block;
            margin-bottom: 45px;
        }

        /* =========================
           BLOG CONTENT
        ========================= */

        .blog-content {
            background: #fff;
            padding: 45px;
            border-radius: 18px;
            border: 1px solid #eee;
        }

        .blog-content h2 {
            font-size: 30px;
            margin: 35px 0 15px;
            color: #111827;
        }

        .blog-content h3 {
            font-size: 24px;
            margin: 30px 0 12px;
            color: #111827;
        }

        .blog-content p {
            font-size: 17px;
            color: #4b5563;
            margin-bottom: 20px;
        }

        .blog-content ul,
        .blog-content ol {
            margin: 20px 0 25px 25px;
            color: #4b5563;
        }

        .blog-content li {
            margin-bottom: 10px;
        }

        .blog-content blockquote {
            border-left: 4px solid #6366f1;
            background: #f5f7ff;
            padding: 20px 25px;
            margin: 30px 0;
            font-size: 18px;
            font-style: italic;
            color: #374151;
            border-radius: 5px;
        }

        .blog-content img {
            width: 100%;
            border-radius: 12px;
            margin: 25px 0;
        }

        /* =========================
           TAGS
        ========================= */

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .tag {
            background: #f3f4f6;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
        }

        /* =========================
           SHARE
        ========================= */

        .share-section {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eee;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .share-title {
            font-weight: 600;
        }

        .share-buttons {
            display: flex;
            gap: 10px;
        }

        .share-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f3f4f6;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        .share-btn:hover {
            background: #6366f1;
            color: #fff;
        }

        /* =========================
           RELATED BLOGS
        ========================= */

        .related-section {
            margin-top: 70px;
        }

        .related-section h2 {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .related-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            overflow: hidden;
            transition: 0.3s;
        }

        .related-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .related-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .related-content {
            padding: 18px;
        }

        .related-content h3 {
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .related-content p {
            font-size: 14px;
            color: #777;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 80px;
            background: #111827;
            color: #fff;
            padding: 30px;
            text-align: center;
        }

        .footer p {
            color: #9ca3af;
            font-size: 14px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .nav {
                display: none;
            }

            .blog-container {
                margin-top: 35px;
            }

            .blog-title {
                font-size: 34px;
            }

            .blog-description {
                font-size: 16px;
            }

            .featured-image {
                height: 280px;
            }

            .blog-content {
                padding: 25px;
            }

            .blog-content h2 {
                font-size: 25px;
            }

            .blog-content p {
                font-size: 16px;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            .share-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->


<!-- BLOG -->

<main class="blog-container">

    <!-- BLOG HEADER -->

    <div class="blog-header">

       

        <h1 class="blog-title" id="title">
            
        </h1>

        <p class="blog-description" id="blog-description">
            
        </p>

        <!-- AUTHOR -->

        <div class="author-info">

           

            <div class="author-details">

                <div class="author-name" id="author">
                    Bhavesh Kapoor
                </div>

                <div class="blog-date" id="blog-date">
                    September 29, 2026 · 
                </div>

            </div>

        </div>

    </div>


    <!-- FEATURED IMAGE -->

    <img
        src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1400&q=80"
        alt="Artificial Intelligence"
        class="featured-image"
    >


    <!-- BLOG CONTENT -->

   


    <!-- RELATED BLOGS -->

    

</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    async function getBlogDetail(slug){
       let blogDetail =  await fetch(`http://localhost:9000/api/blogs/${slug}`)
       let data  = await blogDetail.json();
       let result  = data.data;
       if(result.length ==0){
            window.location.href = '/index.html';
       }else{
        document.getElementById('title').innerText =result.title
        document.getElementById('blog-description').innerText=result.body
        document.getElementById('author').innerText=result.author
        document.getElementById('blog-date').innerHTML=result.createdAt
       }

       console.log(result)


    }
    
    getBlogDetail(slug)

</script>



</body>
</html>
