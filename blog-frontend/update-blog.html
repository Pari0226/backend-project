//  get the blogs data first
const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    let Blogid= ""
    async function getBlogDetail(slug){
       let blogDetail =  await fetch(`http://localhost:9000/api/blogs/${slug}`)
       let data  = await blogDetail.json();
       let result  = data.data;
       if(!result){
            window.location.href = '/index.html';
       }else{
        document.getElementById('blog-title').value =result.title
        document.getElementById('slug').value =result.slug
        Blogid = result._id

        let image = result?.coverImage ? 'http://localhost:9000/public/temp/'+result.coverImage:'' 
        let imgdiv=    document.getElementById('uploaded-image')
        let img= document.createElement('img')
        img.setAttribute('src',image);
        img.style.height="auto"
        img.style.width="100px"
        img.style.marginTop="10px"
        let anchorTag = document.createElement('a');
        anchorTag.setAttribute('href',image)
        anchorTag.setAttribute('target','__blank');
        imgdiv.append(img)
        anchorTag.append(img)
        imgdiv.append(anchorTag)
        tinymce.get('description').setContent(result.body)
        // document.getElementById('description').innerText=result.body
        document.getElementById('author').value=result.author
        // document.getElementById('blog-date').innerHTML=result.createdAt
       }

       console.log(result)

    }


    // ####################################################### UPDATE FORM 

        //  update form 
        let blogform  = document.getElementById('blogForm');
        blogform.addEventListener('submit',async(e)=>{
            e.preventDefault()
            document.getElementById('submit-button').innerText="Processing.....";
            let title =blogtitle.value.trim();
            let image = document.getElementById('image').files[0];    //  you have use .files[0] instead of . value while dealing with image
            let slug = document.getElementById('slug').value.trim();
            let validation=false

            let author = document.getElementById('author').value.trim();
            let description = tinymce.get('description').getContent().trim(); // TinyMCE doesn't sync the textarea until saved, so read from the editor
            let error=document.getElementsByClassName('error');
            
            Array.from(error).forEach(element => {
                // this for removing the general error messagae
                document.getElementById(element.getAttribute('id')).innerText=''   

                // end

                // this is for hiding the alert box
                let errorMessage =  document.getElementById('error-message')
                errorMessage.style.display="none"    

                // end 
            });


            if( title==''){
                let blogerror = document.getElementById('blog-title-error');
                blogerror.innerHTML="blog title is required!"
                validation=true
            }
            if( slug==''){
                let slugerror = document.getElementById('slug-error');
                slugerror.innerHTML="blog slug is required!"
                validation= true
            }
            if( author==''){
                let autherros = document.getElementById('author-error');
                autherros.innerHTML="author is required!"
                validation=true
            }

            if(validation){
                document.getElementById('submit-button').innerText="Submit";

                return  // this is for preventing rest of the code to execute 
            }

            let formData = new FormData();
            if(image) formData.append('coverImage',image)
            formData.append('title',title)
            formData.append('slug',slug)
            formData.append('author',author)
            formData.append('body',description)

            //  update api

            let response = await fetch(`http://localhost:9000/api/blogs/${Blogid}`,{
                'method':"PUT",
                'body':formData
            })
            if(!response.ok){
                let data  = await response.json();
                let errorMessage =  document.getElementById('error-message')
                errorMessage.style.display="block"
                errorMessage.innerText=data?.error || data?.message
                document.getElementById('submit-button').innerText="Submit";

                return 
            }
            if(response.status == 200){
                let data  = await response.json();
                alert(data.message)
                window.location.href=`/blog-frontend/update-blog.html?slug=${slug}`
            }
               
        

        })
